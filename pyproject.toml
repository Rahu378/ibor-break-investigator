[project]
name = "breakbot"
version = "0.4.0"
description = "Agent that investigates IBOR vs custodian position and cash breaks"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14",
    "langgraph>=1.0",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "sqlglot>=27",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["breakbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
